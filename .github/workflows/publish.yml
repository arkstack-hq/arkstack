name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (optional)'
        required: false
        default: ''

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arkstack_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arkstack_dev?schema=public
      NODE_ENV: test
      NODE_CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Build Packages
        run: |
          pnpm -w run build:packages
          pnpm --filter @arkstack/console run build
          pnpm install --frozen-lockfile

      - name: Build Express
        run: |
          cd express; 
          pnpm prepare
          pnpm build

      - name: Build H3
        run: |
          cd h3; 
          pnpm prepare
          pnpm build

      - name: Run database migrations
        run: pnpm arkorm migrate:fresh;

      - name: Run tests
        run: pnpm test

      - name: Publish to NPM
        run: pnpm publish:packages --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
